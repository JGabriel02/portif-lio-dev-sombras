<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Default = dark (sombra) fills. Under prefers-color-scheme: light the shiny fills apply. -->
  <style>
    .frame{fill:#A77BFF}
    .win{fill:#140F1F}
    .g0{stop-color:#4A3478}
    .g1{stop-color:#C2367A}
    .eye{fill:#FF4D6D}
    .mouth{stroke:#FF8FB0}
    .claw{fill:#E9E3F4}
    @media (prefers-color-scheme: light){
      .frame{fill:#6D3FD6}
      .win{fill:#F7F5FB}
      .g0{stop-color:#E9E3F4}
      .g1{stop-color:#FF8AB0}
      .eye{fill:#E0244A}
      .mouth{stroke:#6D3FD6}
      .claw{fill:#6D3FD6}
    }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="g0"/>
      <stop offset="1" class="g1"/>
    </linearGradient>
  </defs>
  <rect class="frame" x="2" y="2" width="60" height="60" rx="14"/>
  <rect class="win" x="10" y="10" width="44" height="44" rx="8"/>
  <path d="M12 54 L12 30 L18 36 L20 22 L27 30 L32 18 L37 30 L44 22 L46 36 L52 30 L52 54 Z" fill="url(#g)"/>
  <path class="eye" d="M18 37 L29 41 L20 45 Z"/>
  <path class="eye" d="M46 37 L35 41 L44 45 Z"/>
  <path class="mouth" d="M25 49 Q32 53 39 48" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path class="claw" d="M14 54 L16 50 L18 54 L20 50 L22 54 Z M42 54 L44 50 L46 54 L48 50 L50 54 Z"/>
</svg>
